<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Student Login - VNR VJIET Canteen</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#b91c1c">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        .auth-card {
            max-width: 440px;
            width: 100%;
            border-radius: 1.25rem;
        }
        .vnr-header-badge {
            background: linear-gradient(135deg, #991b1b, #7f1d1d);
        }
    </style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">

    <div class="card border-0 shadow-lg auth-card bg-white p-4 p-sm-5">
        <!-- VNR VJIET Branding -->
        <div class="text-center mb-4">
            <div class="vnr-header-badge text-white rounded-circle mx-auto d-flex align-items-center justify-content-center mb-3 shadow" style="width: 64px; height: 64px;">
                <i class="bi bi-mortarboard-fill fs-2 text-warning"></i>
            </div>
            <span class="badge bg-danger-subtle text-danger rounded-pill px-3 py-1 small fw-bold mb-1">
                VNR VJIET HYDERABAD
            </span>
            <h4 class="fw-bold text-dark mb-1">Student Canteen Login</h4>
            <p class="text-muted small mb-0">Sign in to track orders, receive live tokens & skip queues.</p>
        </div>

        <!-- Alert Messages -->
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show rounded-3 p-2 small border-0 d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-exclamation-circle-fill text-danger"></i>
            <span class="flex-grow-1" th:text="${errorMessage}"></span>
            <button type="button" class="btn-close p-2" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show rounded-3 p-2 small border-0 d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-check-circle-fill text-success"></i>
            <span class="flex-grow-1" th:text="${successMessage}"></span>
            <button type="button" class="btn-close p-2" data-bs-dismiss="alert"></button>
        </div>

        <!-- Login Form -->
        <form th:action="@{/student/login}" method="post">
            <div class="mb-3">
                <label class="form-label small fw-bold text-dark">Roll Number or College Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person-badge"></i></span>
                    <input type="text" id="identifierInput" name="identifier" class="form-control bg-light border-start-0" 
                           placeholder="e.g. 21071A0501 or rahul@vnrvjiet.in" required autofocus>
                </div>
                <div class="form-text small text-muted">Use your 10-digit VNR Roll No or registered email.</div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold text-dark d-flex justify-content-between align-items-center">
                    <span>Password</span>
                    <button type="button" class="btn btn-link p-0 text-muted text-decoration-none small" style="font-size: 0.75rem;" onclick="togglePassword()">
                        <i class="bi bi-eye" id="toggleIcon"></i> <span id="toggleText">Show</span>
                    </button>
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" id="passwordInput" name="password" class="form-control bg-light border-start-0" 
                           placeholder="Enter your account password" required>
                </div>
            </div>

            <!-- Demo Fill Helper -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill py-1 px-2 small" style="font-size: 0.75rem;" onclick="fillDemoStudent()">
                    <i class="bi bi-magic text-warning me-1"></i> Demo Fill (21071A0501)
                </button>
                <a th:href="@{/student}" class="small text-muted text-decoration-none">Continue as Guest &rarr;</a>
            </div>

            <button type="submit" class="btn btn-danger w-100 rounded-pill py-2 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2 mb-3">
                <i class="bi bi-box-arrow-in-right"></i>
                <span>Sign In to Canteen</span>
            </button>
        </form>

        <div class="text-center border-top pt-3">
            <p class="small text-muted mb-2">New student at VNR VJIET?</p>
            <a th:href="@{/student/register}" class="btn btn-outline-dark btn-sm rounded-pill px-4 fw-semibold">
                <i class="bi bi-person-plus me-1"></i> Create Student Account
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword() {
            const pass = document.getElementById('passwordInput');
            const icon = document.getElementById('toggleIcon');
            const text = document.getElementById('toggleText');
            if (pass.type === 'password') {
                pass.type = 'text';
                icon.className = 'bi bi-eye-slash';
                text.textContent = 'Hide';
            } else {
                pass.type = 'password';
                icon.className = 'bi bi-eye';
                text.textContent = 'Show';
            }
        }

        function fillDemoStudent() {
            document.getElementById('identifierInput').value = '21071A0501';
            document.getElementById('passwordInput').value = 'student123';
        }
    </script>
</body>
</html>
