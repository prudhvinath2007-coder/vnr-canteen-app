<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Student Registration - VNR VJIET Canteen</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#b91c1c">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        .auth-card {
            max-width: 520px;
            width: 100%;
            border-radius: 1.25rem;
        }
        .vnr-header-badge {
            background: linear-gradient(135deg, #991b1b, #7f1d1d);
        }
    </style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3 py-4">

    <div class="card border-0 shadow-lg auth-card bg-white p-4 p-sm-5 my-3">
        <!-- VNR VJIET Branding -->
        <div class="text-center mb-3">
            <div class="vnr-header-badge text-white rounded-circle mx-auto d-flex align-items-center justify-content-center mb-2 shadow" style="width: 58px; height: 58px;">
                <i class="bi bi-mortarboard-fill fs-3 text-warning"></i>
            </div>
            <span class="badge bg-danger-subtle text-danger rounded-pill px-3 py-1 small fw-bold mb-1">
                VNR VJIET HYDERABAD
            </span>
            <h4 class="fw-bold text-dark mb-1">Student Registration</h4>
            <p class="text-muted small mb-0">Create your campus dining account for fast online ordering & real-time notification alerts.</p>
        </div>

        <!-- Alert Messages -->
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show rounded-3 p-2 small border-0 d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-exclamation-circle-fill text-danger"></i>
            <span class="flex-grow-1" th:text="${errorMessage}"></span>
            <button type="button" class="btn-close p-2" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show rounded-3 p-2 small border-0 d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-check-circle-fill text-success"></i>
            <span class="flex-grow-1" th:text="${successMessage}"></span>
            <button type="button" class="btn-close p-2" data-bs-dismiss="alert"></button>
        </div>

        <!-- Registration Form -->
        <form th:action="@{/student/register}" method="post" id="regForm">
            <div class="row g-2 mb-2">
                <div class="col-sm-12">
                    <label class="form-label small fw-bold text-dark mb-1">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                        <input type="text" name="fullName" class="form-control bg-light border-start-0" placeholder="e.g. Sravan Reddy" required>
                    </div>
                </div>
            </div>

            <div class="row g-2 mb-2">
                <div class="col-sm-6">
                    <label class="form-label small fw-bold text-dark mb-1">Roll Number</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person-badge"></i></span>
                        <input type="text" name="rollNumber" id="rollNumberInput" class="form-control bg-light border-start-0 text-uppercase" 
                               placeholder="21071A0501" required pattern="[A-Za-z0-9]{8,12}">
                    </div>
                    <div class="form-text small text-muted" style="font-size: 0.72rem;">e.g. 21071A05XX</div>
                </div>

                <div class="col-sm-6">
                    <label class="form-label small fw-bold text-dark mb-1">Branch / Dept</label>
                    <select name="department" class="form-select bg-light" required>
                        <option value="CSE" selected>CSE (Computer Science)</option>
                        <option value="IT">IT (Information Tech)</option>
                        <option value="AIDS">AI & Data Science</option>
                        <option value="CSBS">CS & Business Systems</option>
                        <option value="ECE">ECE (Electronics)</option>
                        <option value="EEE">EEE (Electrical)</option>
                        <option value="MECH">Mechanical Engg</option>
                        <option value="CIVIL">Civil Engg</option>
                        <option value="OTHER">Other Department</option>
                    </select>
                </div>
            </div>

            <div class="row g-2 mb-2">
                <div class="col-sm-6">
                    <label class="form-label small fw-bold text-dark mb-1">College Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="email" id="emailInput" class="form-control bg-light border-start-0" 
                               placeholder="rollno@vnrvjiet.in" required>
                    </div>
                </div>

                <div class="col-sm-6">
                    <label class="form-label small fw-bold text-dark mb-1">Mobile Number</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-telephone"></i></span>
                        <input type="tel" name="phone" class="form-control bg-light border-start-0" 
                               placeholder="10-digit mobile" required pattern="[0-9]{10}">
                    </div>
                </div>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-sm-6">
                    <label class="form-label small fw-bold text-dark mb-1">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" id="pass1" class="form-control bg-light border-start-0" 
                               placeholder="Min 6 characters" minlength="6" required>
                    </div>
                </div>

                <div class="col-sm-6">
                    <label class="form-label small fw-bold text-dark mb-1">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-shield-check"></i></span>
                        <input type="password" name="confirmPassword" id="pass2" class="form-control bg-light border-start-0" 
                               placeholder="Re-type password" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-danger w-100 rounded-pill py-2 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2 mb-3">
                <i class="bi bi-check-circle-fill"></i>
                <span>Complete Registration & Sign In</span>
            </button>
        </form>

        <div class="d-flex justify-content-between align-items-center border-top pt-3 small">
            <a th:href="@{/student/login}" class="text-decoration-none fw-semibold text-danger">
                <i class="bi bi-arrow-left me-1"></i> Already registered? Sign In
            </a>
            <a th:href="@{/student}" class="text-decoration-none text-muted">
                Continue as Guest &rarr;
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Auto-suggest VNR email when roll number is entered
        const rollInput = document.getElementById('rollNumberInput');
        const emailInput = document.getElementById('emailInput');
        rollInput.addEventListener('input', () => {
            const val = rollInput.value.trim().toLowerCase();
            if (val.length >= 8 && (!emailInput.value || emailInput.value.includes('@vnrvjiet.in'))) {
                emailInput.value = val + '@vnrvjiet.in';
            }
        });
    </script>
</body>
</html>
