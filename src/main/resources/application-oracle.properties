# Oracle Database Profile Configuration
# Activate via command line: --spring.profiles.active=oracle
# Or in application.properties: spring.profiles.active=oracle

spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
# For standard Oracle XE (11g/18c): jdbc:oracle:thin:@localhost:1521:XE
# For Oracle 19c/21c/23ai: jdbc:oracle:thin:@localhost:1521/ORCLCDB
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=CANTEEN_USER
spring.datasource.password=canteen123

# HikariCP Connection Pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate with Oracle Dialect
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=CANTEEN_USER

